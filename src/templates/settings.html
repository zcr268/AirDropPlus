<!DOCTYPE html>
<html lang="{{ config.language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Settings') }}</title>
    <style>
        :root {
            --bg: #f4f5f7;
            --card-bg: #ffffff;
            --text: #1f2329;
            --text-muted: #8a909a;
            --border: #e6e8eb;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --input-bg: #ffffff;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.04);
            --radius: 14px;
        }
        @media (prefers-color-scheme: dark) {
            :root[data-theme="auto"] {
                --bg: #0f1115;
                --card-bg: #181b20;
                --text: #e6e8eb;
                --text-muted: #8a909a;
                --border: #2a2e35;
                --primary: #3b82f6;
                --primary-hover: #60a5fa;
                --input-bg: #20242b;
                --shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
            }
        }
        :root[data-theme="dark"] {
            --bg: #0f1115;
            --card-bg: #181b20;
            --text: #e6e8eb;
            --text-muted: #8a909a;
            --border: #2a2e35;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --input-bg: #20242b;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 40px 20px 80px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }
        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 4px;
            letter-spacing: -0.02em;
        }
        .page-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0 0 28px;
        }
        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
        }
        .theme-toggle {
            display: inline-flex;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 3px;
            box-shadow: var(--shadow);
            flex-shrink: 0;
        }
        .theme-toggle button {
            all: unset;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 30px;
            border-radius: 7px;
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1;
            transition: background .15s, color .15s;
        }
        .theme-toggle button:hover { color: var(--text); }
        .theme-toggle button.active {
            background: var(--primary);
            color: #fff;
        }
        .theme-toggle button svg { width: 17px; height: 17px; }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            padding: 18px 22px 6px;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 22px;
            border-top: 1px solid var(--border);
        }
        .row:first-of-type { border-top: none; }
        .row-text { flex: 1; min-width: 0; }
        .row-label {
            font-size: 15px;
            font-weight: 500;
            display: block;
            margin: 0;
        }
        .row-desc {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 3px;
        }
        .row-desc.warn { color: var(--danger); }
        /* info tooltip */
        .info-tip {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            margin-left: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            color: var(--card-bg);
            font-size: 11px;
            font-weight: 700;
            cursor: help;
            vertical-align: middle;
            flex-shrink: 0;
        }
        .info-tip .info-bubble {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            width: max-content;
            max-width: 240px;
            padding: 8px 12px;
            background: var(--text);
            color: var(--bg);
            font-size: 12.5px;
            font-weight: 400;
            line-height: 1.45;
            text-align: left;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            opacity: 0;
            pointer-events: none;
            transition: opacity .18s, transform .18s;
            z-index: 100;
        }
        .info-tip .info-bubble::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: var(--text);
        }
        .info-tip:hover .info-bubble,
        .info-tip:focus .info-bubble {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .row.stacked {
            flex-direction: column;
            align-items: stretch;
        }
        .row.stacked .control { width: 100%; }
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            color: var(--text);
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
            font-family: inherit;
        }
        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .control-narrow { max-width: 220px; }
        /* path picker: input + browse button */
        .path-group {
            display: flex;
            gap: 8px;
        }
        .path-group input { flex: 1; min-width: 0; }
        .btn-browse {
            flex-shrink: 0;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 500;
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 9px;
            cursor: pointer;
            transition: border-color .15s, background .15s;
        }
        .btn-browse:hover {
            background: var(--bg);
            border-color: var(--primary);
            color: var(--text);
        }
        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            padding: 0;
        }
        .btn-icon svg { width: 20px; height: 20px; }
        /* toggle switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
            flex-shrink: 0;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: var(--border);
            transition: .25s;
            border-radius: 26px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: #fff;
            transition: .25s;
            border-radius: 50%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }
        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 4px;
        }
        button {
            padding: 11px 28px;
            font-size: 15px;
            font-weight: 600;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background .15s, transform .05s;
            font-family: inherit;
        }
        button:hover { background: var(--primary-hover); }
        button:active { transform: scale(0.98); }
        /* toast */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform: translateX(-50%) translateY(20px);
            background: var(--text);
            color: var(--bg);
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s, transform .25s;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error { background: var(--danger); color: #fff; }
        /* modal dialog */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
            z-index: 2000;
        }
        .modal-mask.show { opacity: 1; pointer-events: auto; }
        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 380px;
            padding: 24px;
            transform: translateY(10px) scale(0.98);
            transition: transform .2s;
        }
        .modal-mask.show .modal { transform: translateY(0) scale(1); }
        .modal-title {
            font-size: 17px;
            font-weight: 700;
            margin: 0 0 8px;
            color: var(--text);
        }
        .modal-message {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0 0 22px;
            line-height: 1.55;
            word-break: break-word;
        }
        .modal-actions { display: flex; justify-content: flex-end; }
        .modal-actions button { padding: 9px 22px; font-size: 14px; }
    </style>
    <script>
        // Apply saved theme before paint to avoid flashing
        (function () {
            var t = localStorage.getItem('adp-theme') || 'auto';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <div>
                <h1 class="page-title">{{ _('Settings') }}</h1>
                <p class="page-subtitle">AirDrop Plus</p>
            </div>
            <div class="theme-toggle" role="group" aria-label="{{ _('Theme') }}">
                <button type="button" data-set-theme="auto" title="{{ _('System') }}" aria-label="{{ _('System') }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                </button>
                <button type="button" data-set-theme="light" title="{{ _('Light') }}" aria-label="{{ _('Light') }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>
                <button type="button" data-set-theme="dark" title="{{ _('Dark') }}" aria-label="{{ _('Dark') }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                </button>
            </div>
        </div>
        <form id="settingsForm">
            <div class="card">
                <div class="card-title">{{ _('General') }}</div>
                <div class="row stacked">
                    <div class="row-text">
                        <label class="row-label" for="language">{{ _('Language') }}</label>
                    </div>
                    <div class="control">
                        <select id="language" name="language">
                            <option value="auto">{{ _('Follow system') }}</option>
                            <option value="en">English</option>
                            <option value="ru">Русский</option>
                            <option value="zh">中文</option>
                        </select>
                    </div>
                </div>
                <div class="row stacked">
                    <div class="row-text">
                        <label class="row-label" for="key">{{ _('Key') }}</label>
                    </div>
                    <div class="control">
                        <div class="path-group">
                            <input type="text" id="key" name="key" autocomplete="off">
                            <button type="button" class="btn-browse btn-icon" onclick="generateKey()" title="{{ _('Generate random key') }}" aria-label="{{ _('Generate random key') }}">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.3" fill="currentColor" stroke="none"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="row stacked">
                    <div class="row-text">
                        <label class="row-label" for="port">{{ _('Port') }}</label>
                        <div class="row-desc warn">{{ _('Requires restart to take effect') }}</div>
                    </div>
                    <div class="control">
                        <input type="number" id="port" name="port" min="1024" max="65535">
                    </div>
                </div>
                <div class="row stacked">
                    <div class="row-text">
                        <label class="row-label" for="savePath">{{ _('Save Path') }}</label>
                    </div>
                    <div class="control">
                        <div class="path-group">
                            <input type="text" id="savePath" name="savePath">
                            <button type="button" class="btn-browse" onclick="browseFolder()">{{ _('Browse') }}</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">{{ _('Notification & Appearance') }}</div>
                <div class="row">
                    <div class="row-text">
                        <label class="row-label" for="basicNotifier">{{ _('Basic Notification Style') }}<span class="info-tip" tabindex="0">i<span class="info-bubble">{{ _('If Windows notifications do not work, enable the basic notification style.') }}</span></span></label>
                        <div class="row-desc warn">{{ _('Requires restart to take effect') }}</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="basicNotifier" name="basicNotifier">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="row">
                    <div class="row-text">
                        <label class="row-label" for="showIcon">{{ _('Show Icon') }}</label>
                        <div class="row-desc warn">{{ _('Requires restart to take effect, enable in _internal/config.ini if disabled') }}</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="showIcon" name="showIcon">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </form>
    </div>
    <div id="toast" class="toast"></div>
    <div id="modalMask" class="modal-mask">
        <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle">
            <h2 class="modal-title" id="modalTitle">{{ _('Invalid setting') }}</h2>
            <p class="modal-message" id="modalMessage"></p>
            <div class="modal-actions">
                <button type="button" onclick="closeModal()">{{ _('OK') }}</button>
            </div>
        </div>
    </div>
    <script>
        let toastTimer = null;
        // 最近一次成功保存的配置，用于校验失败时回退出错字段
        let savedConfig = null;
        function showToast(message, isError) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.toggle('error', !!isError);
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
        }

        function showModal(message) {
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('modalMask').classList.add('show');
        }
        function closeModal() {
            document.getElementById('modalMask').classList.remove('show');
        }
        document.getElementById('modalMask').addEventListener('click', (e) => {
            if (e.target.id === 'modalMask') closeModal();
        });

        window.addEventListener('load', getSettings);

        // Theme switching
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('adp-theme', theme);
            document.querySelectorAll('.theme-toggle button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.setTheme === theme);
            });
        }
        document.querySelectorAll('.theme-toggle button').forEach(btn => {
            btn.addEventListener('click', () => applyTheme(btn.dataset.setTheme));
        });
        applyTheme(localStorage.getItem('adp-theme') || 'auto');

        // 从表单读取单个字段的当前值
        function readField(field) {
            switch (field) {
                case 'key': return document.getElementById('key').value;
                case 'port': return document.getElementById('port').value;
                case 'save_path': return document.getElementById('savePath').value;
                case 'basic_notifier': return document.getElementById('basicNotifier').checked;
                case 'show_icon': return document.getElementById('showIcon').checked;
                case 'language': return document.getElementById('language').value;
            }
        }

        // 把单个字段的值写回表单
        function writeField(field, value) {
            switch (field) {
                case 'key': document.getElementById('key').value = value; break;
                case 'port': document.getElementById('port').value = value; break;
                case 'save_path': document.getElementById('savePath').value = value; break;
                case 'basic_notifier': document.getElementById('basicNotifier').checked = value; break;
                case 'show_icon': document.getElementById('showIcon').checked = value; break;
                case 'language': document.getElementById('language').value = value; break;
            }
        }

        function getSettings() {
            fetch('/settings/configs')
              .then(response => response.json())
              .then(data => {
                    if (data.success) {
                        savedConfig = {
                            key: data.data.key,
                            port: data.data.port,
                            save_path: data.data.save_path,
                            basic_notifier: data.data.basic_notifier,
                            show_icon: data.data.show_icon,
                            language: data.data.language || 'auto'
                        };
                        Object.keys(savedConfig).forEach(f => writeField(f, savedConfig[f]));
                        bindAutoSave();
                    }
                })
              .catch(error => {
                    console.error('{{ _("Error getting configuration") }}:', error);
                    showToast('{{ _("Error getting configuration") }}', true);
                });
        }

        // 自动保存单个字段：只提交该字段，校验失败时弹框并回退该字段到上次有效值
        function saveField(field) {
            const value = readField(field);
            // 值没变则跳过，避免离焦时的重复提交
            if (savedConfig && savedConfig[field] === value) return Promise.resolve();

            const payload = {};
            payload[field] = value;

            return fetch('/settings/configs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    savedConfig[field] = value;
                    if (field === 'language') {
                        // 语言已变更，刷新页面让服务端用新语言重新渲染
                        location.reload();
                        return;
                    }
                    showToast('{{ _("Settings saved!") }}', false);
                } else {
                    // 校验失败：回退该字段到上次成功保存的值并弹框提示
                    if (savedConfig) writeField(field, savedConfig[field]);
                    showModal(data.msg || '{{ _("Failed to save settings") }}');
                }
            })
            .catch(error => {
                console.error('{{ _("Error saving settings") }}');
                if (savedConfig) writeField(field, savedConfig[field]);
                showToast('{{ _("Error saving settings") }}', true);
            });
        }

        // 绑定自动保存事件：文本框离焦(change)、选择器/开关切换(change)
        function bindAutoSave() {
            const map = {
                key: 'key',
                port: 'port',
                savePath: 'save_path',
                language: 'language',
                basicNotifier: 'basic_notifier',
                showIcon: 'show_icon'
            };
            Object.keys(map).forEach(id => {
                document.getElementById(id).addEventListener('change', () => saveField(map[id]));
            });
        }

        function generateKey() {
            // 16 位强密码：大小写字母 + 数字 + 符号，使用加密级随机源
            const charset = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*-_=+';
            const length = 16;
            const randomValues = new Uint32Array(length);
            crypto.getRandomValues(randomValues);
            let key = '';
            for (let i = 0; i < length; i++) {
                key += charset[randomValues[i] % charset.length];
            }
            document.getElementById('key').value = key;
            saveField('key');
        }

        function browseFolder() {
            fetch('/settings/select_folder')
              .then(response => response.json())
              .then(data => {
                    if (data.success && data.data && data.data.path) {
                        document.getElementById('savePath').value = data.data.path;
                        saveField('save_path');
                    }
                })
              .catch(error => {
                    console.error('{{ _("Error selecting folder") }}:', error);
                    showToast('{{ _("Error selecting folder") }}', true);
                });
        }
    </script>
</body>
</html>
